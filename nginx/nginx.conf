worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Логи и типы данных (хорошая практика для стабильной работы)
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream backend_bot {
        # Если контейнер называется max_bot и слушает порт 8080
        server max_bot:8080;
    }

    server {
        listen 443 ssl;
        # bot.klassdetal.ru; # Не забудьте поменять на свой домен!
        server_name bot.example.ru
        # SSL сертификаты
        ssl_certificate /nginx/ssl/fullchain.pem;
        ssl_certificate_key /nginx/ssl/privkey.pem;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;

        # 1. ЗАЩИТА: Блокируем опасные пути сразу
        # Важно: используем ^~ чтобы этот блок имел приоритет над обычными путями
        location ^~ /actuator {return 403;}
        location ^~ /swagger-ui {return 403;}
        location ^~ /v3/api-docs {return 403;}

        # 2. ВЕБХУК: Специфичный путь для мессенджера MAX
        location /api/v1/webhook {
            proxy_pass http://backend_bot;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 25s;
            proxy_buffering off;
        }

        # 3. ОСТАЛЬНОЕ API: Если боту нужны другие эндпоинты (например, для админки)
#         location /api/ {
#             proxy_pass http://backend_bot;
#             proxy_http_version 1.1;
#             proxy_set_header Connection "";
#             proxy_set_header Host $host;
#             proxy_set_header X-Real-IP $remote_addr;
#             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#             proxy_set_header X-Forwarded-Proto $scheme;
#         }

        # 4.КОРЕНЬ: Запрещаем доступ ко всему остальному (веб-страниц у бота нет)
        location / {
            return 403;
        }

        # Блокировка небезопасных методов запроса
        if ($request_method ~ ^(TRACE|TRACK|DEBUG)) {
            return 405;
        }
    }
}
