secrets:
  max.token:
    external: true
  max.bot.webhook.secret:
    external: true
  postgres.password:
    external: true
  spring.rabbitmq.password:
    external: true
  rabbitmq.default.conf:
    external: true
#  nginx_privkey:
#    file: ./nginx/ssl/privkey.pem

services:
#  nginx:
#    container_name: nginx
#    image: nginx:1.31.8-alpine
#    restart: always
#    ports:
#      - "443:443"
#    depends_on:
#      - max_bot
#    networks:
#      - app-network
#    volumes:
#      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
#      - ./nginx/ssl:/etc/nginx/ssl:ro

  postgresql:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bot_class_detail
      POSTGRES_USER: root
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres.password
    secrets:
      - postgres.password
    command: postgres -c max_connections=300
    healthcheck:
      test: ["CMD_SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
      restart_policy:
        condition: on-failure
    volumes:
      - pgdata:/var/lib/postgresql/18/data
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:management-alpine
    user: rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_CONFIG_FILES: /run/secrets
    secrets:
      - rabbitmq.default.conf
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure


  max_bot:
    image: classdetail/max-bot:0.0.1
    secrets:
      - max.token
      - max.bot.webhook.secret
      - source: postgres.password
        target: spring.datasource.password
      - spring.rabbitmq.password
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: root
      SPRING_CONFIG_IMPORT: "optional:configtree:/run/secrets/"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: bot
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '2'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgresql
      - rabbitmq
    networks:
      - app-network

networks:
  app-network:
    driver: overlay
    attachable: true

volumes:
  web_root:
  rabbitmq_data:
  pgdata: